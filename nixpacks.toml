[phases.setup]
nixPkgs = [
  "php83",
  "php83Packages.composer",
  "php83Extensions.pdo_mysql",
  "php83Extensions.pdo_sqlite",
  "php83Extensions.gd",
  "php83Extensions.zip",
  "php83Extensions.mbstring",
  "php83Extensions.xml",
  "php83Extensions.curl"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
  "php artisan storage:link || true"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --class=AdminUserSeeder --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
